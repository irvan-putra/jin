# Real-OS smokes for jin (arm64-only APK: the bundled Delta Chat core has no
# x86 build). Two hosted routes:
# - smoke (macos-14): native accelerated arm64 emulator, screenshots the three
#   bot states and the left menu for pixel inspection. Requires the account to
#   have macos runners available.
# - smoke-translated (ubuntu-latest): the google_apis API34 x86_64 image's
#   ARM->x86 translation runs the real arm64 APK; evidenced working by bidik's
#   dc-runtime-smoke run 43789868731 (2026-11-16, success, same pattern).
# Manual trigger only. No secrets, no signing, contents: read. Artifacts stay
# on the repo's own run page.
# Fixture state only (synthetic bot address); no account, network or core run
# in the UI smoke; the translation smoke runs the OFFLINE validation probe.
name: ui-smoke
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jin-ui-smoke
  cancel-in-progress: true

jobs:
  smoke:
    # Apple Silicon host: native accelerated arm64 emulation. Hosted macos
    # runner availability is account-dependent; smoke-translated below is the
    # route that does not depend on it.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Expose Chaquopy build Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: UI smoke on arm64 emulator
        uses: reactivecircus/android-emulator-runner@9b78b339fcface67c267bcf3f3af3fd5430c6401 # v2.33.0
        with:
          api-level: 34
          arch: arm64-v8a
          target: default
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: sh tools/ui-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-smoke-shots
          path: shots/
          retention-days: 14
          if-no-files-found: error

  smoke-translated:
    # Exact working config mirrored from bidik's dc-runtime-smoke.yml
    # (ubuntu KVM gate, google_apis API34 x86_64, 4 cores, 4 GiB, swiftshader,
    # android-emulator-runner v2.33.0 pinned sha, setup-python 3.10 for
    # Chaquopy 17's CPython 3.10 build requirement).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Expose Chaquopy build Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Enable KVM (hardware acceleration) or stop
        # No silent TCG runs; same gate as bidik's dc-runtime-smoke.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm || { echo 'KVM unavailable to this job; refusing a silent TCG run' >&2; exit 1; }
      - name: Build debug APK (arm64)
        run: gradle --no-daemon assembleDebug
      - name: Runtime smoke on ARM-translating emulator
        uses: reactivecircus/android-emulator-runner@9b78b339fcface67c267bcf3f3af3fd5430c6401 # v2.33.0
        with:
          api-level: 34
          # google_apis API34 x86_64 images ship ARM->x86 translation;
          # the default AOSP image does not advertise arm64 support.
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # one line calling one file (inline if/fi broke a bidik run)
          script: sh tools/translation-smoke.sh

  transport-gate:
    # Joint cross-app gate on the proven translated runtime: jin + a second
    # probe app (own package, own cert) on ONE emulator, exercising the real
    # binder auth boundary, default-off grants, real ParcelFileDescriptor
    # pipes with the byte cap, bridge round trips and visible failure
    # behavior. Synthetic fixture content only; no account, no relay, no
    # private data. Exactly-once is NOT claimed (see transport-contract.md).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Expose Chaquopy build Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Enable KVM (hardware acceleration) or stop
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm || { echo 'KVM unavailable to this job; refusing a silent TCG run' >&2; exit 1; }
      - name: Build jin + probe APKs
        run: gradle --no-daemon :app:assembleDebug :probe:assembleDebug
      - name: Probe signing cert hash
        # apksigner, not keytool: AGP debug APKs are v2-signed, which
        # keytool -printcert -jarfile cannot read. Provider pins UPPERCASE hex.
        id: cert
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "sha256=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs probe/build/outputs/apk/debug/probe-debug.apk | grep -m1 'SHA-256 digest:' | sed 's/.*SHA-256 digest: //' | tr 'a-f' 'A-F')" >> "$GITHUB_OUTPUT"
      - name: Transport gate on ARM-translating emulator
        uses: reactivecircus/android-emulator-runner@9b78b339fcface67c267bcf3f3af3fd5430c6401 # v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh tools/transport-gate.sh
        env:
          PROBE_CERT_SHA256: ${{ steps.cert.outputs.sha256 }}
