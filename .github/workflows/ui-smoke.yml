# Real-OS UI smoke: installs the CI debug APK on an arm64 emulator (jin is
# arm64-only: the bundled Delta Chat core has no x86 build), screenshots the
# three bot states and the left menu opened by a real edge swipe, and uploads
# the shots for pixel inspection. Manual trigger only. No secrets, no signing,
# contents: read. Artifacts stay on the repo's own run page.
# Fixture state only (synthetic bot address); no account, network or core run.
name: ui-smoke
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jin-ui-smoke
  cancel-in-progress: true

jobs:
  smoke:
    # Apple Silicon host: the only hosted route with an accelerated arm64 Android emulator.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Expose Chaquopy build Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: UI smoke on arm64 emulator
        uses: reactivecircus/android-emulator-runner@9b78b339fcface67c267bcf3f3af3fd5430c6401 # v2.33.0
        with:
          api-level: 34
          arch: arm64-v8a
          target: default
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: sh tools/ui-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-smoke-shots
          path: shots/
          retention-days: 14
          if-no-files-found: error
