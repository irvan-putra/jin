name: live-relay-route

# Dispatch-only, throwaway-account live capture-route proof: the app signs
# into EXISTING test relay account A (paired with B as its Bidik peer) and
# B, running on the runner, drives the capture-result wire: result JSON,
# declared PNG, and a stale-caption refusal, all through the real chatmail
# relay. Credentials via repo secrets, scoped to be deleted after the one
# approved run; synthetic content only; no user data, no other accounts.
# Credentials never appear in argv, logs or artifacts (stdin handoff; the
# app deletes its credential file before entering the live loop).

on:
  workflow_dispatch:

concurrency:
  group: jin-live-relay-route
  cancel-in-progress: true

jobs:
  live-route:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Expose Chaquopy build Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Enable KVM (hardware acceleration) or stop
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm || { echo 'KVM unavailable to this job; refusing a silent TCG run' >&2; exit 1; }
      - name: Build jin debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Live capture-route proof on ARM-translating emulator
        uses: reactivecircus/android-emulator-runner@9b78b339fcface67c267bcf3f3af3fd5430c6401 # v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh tools/live-relay-route.sh
        env:
          JIN_RELAY_A_ADDR: ${{ secrets.JIN_RELAY_A_ADDR }}
          JIN_RELAY_A_PASSWORD: ${{ secrets.JIN_RELAY_A_PASSWORD }}
          JIN_RELAY_B_ADDR: ${{ secrets.JIN_RELAY_B_ADDR }}
          JIN_RELAY_B_PASSWORD: ${{ secrets.JIN_RELAY_B_PASSWORD }}
