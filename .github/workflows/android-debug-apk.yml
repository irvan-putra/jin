name: Jin Android Debug Qualification

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: jin-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Expose Chaquopy build Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Assert package identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT=$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.vanipy.jin' versionCode='10' versionName='0.4-r14'"

      - name: Upload qualification APK
        uses: actions/upload-artifact@v4
        with:
          name: jin-qualification-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 5
